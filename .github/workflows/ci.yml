name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # Secrets cannot be referenced directly in `if:` conditionals, so they are
  # exposed as job-level env vars and every step is guarded on env. With no
  # secrets configured the job no-ops.
  integration:
    needs: test
    runs-on: ubuntu-latest
    env:
      FANCOURIER_CLIENT_ID: ${{ secrets.FANCOURIER_CLIENT_ID }}
      FANCOURIER_USER: ${{ secrets.FANCOURIER_USER }}
      FANCOURIER_PASSWORD: ${{ secrets.FANCOURIER_PASSWORD }}
    steps:
      - name: Checkout
        if: env.FANCOURIER_CLIENT_ID != ''
        uses: actions/checkout@v4
      - name: Use Node.js 22
        if: env.FANCOURIER_CLIENT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: env.FANCOURIER_CLIENT_ID != ''
        run: npm ci
      - name: Run integration tests
        if: env.FANCOURIER_CLIENT_ID != ''
        run: npm run test:integration
